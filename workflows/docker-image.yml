name: Test and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genreSorter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements.txt
      - name: Test genre filters and large album pages
        run: node --test tests/test_browser.cjs
      - name: Test tag editing, preservation and permissions
        run: python -m unittest discover -s tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import ast
          from pathlib import Path
          tree = ast.parse(Path("server.py").read_text())
          for statement in tree.body:
              if isinstance(statement, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "APP_VERSION" for target in statement.targets):
                  version = ast.literal_eval(statement.value)
                  if not isinstance(version, str) or not version or any(c in version for c in "\r\n"):
                      raise ValueError("APP_VERSION must be a nonempty single-line string")
                  print(f"version={version}")
                  break
          else:
              raise ValueError("server.py has no APP_VERSION")
          PYTHON
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=genreSorter
            org.opencontainers.image.description=View and bulk edit album genres on your music server
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish candidate for x86 and ARM servers
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VCS_REF=${{ github.sha }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published version and commit on both architectures
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash .github/scripts/verify-image.sh
      - name: Promote verified current main commit to latest
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash .github/scripts/promote-latest.sh
