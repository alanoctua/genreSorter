services:
  genresorter:
    build: .
    container_name: genresorter
    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8787}:8787"
    environment:
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in .env}"
    volumes:
      - type: bind
        source: "${MUSIC_PATH:?Set MUSIC_PATH to the full music folder path in .env}"
        target: /music
        read_only: false
        bind:
          create_host_path: false
      - genreSorter-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  genreSorter-data:
